service: sheet-assist-api-minimal

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment: ${file(env-${self:provider.stage}.yml):${self:provider.stage}}
  httpApi:
    cors:
      allowedOrigins:
        - https://localhost:3000
        - http://localhost:3000
        - https://aidocassist.com
        - https://sheetassistapp.com
        - https://www.aidocassist.com
        - https://api.aidocassist.com
        - http://api.aidocassist.com
        - https://1t2fkfa15h.execute-api.us-east-1.amazonaws.com
      allowedHeaders:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
        - '*'
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - '*'
      allowCredentials: true
      maxAge: 86400

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    usePoetry: false
    slim: true
    slimPatterns:
      - "**/*.so"
      - "**/*.dist-info/**"
      - "**/__pycache__/**"
      - "**/*.egg-info/**"
      - "**/tests/**"
      - "**/.github/**"
      - "**/.pytest_cache/**"
    strip: false
    fileName: requirements-lambda.txt
    noDeploy:
      - pytest
      - pytest-cov
      - coverage

package:
  individually: true
  patterns:
    - '!**'
    - lambda_handler_minimal.py
    - requirements-lambda.txt

functions:
  api:
    handler: lambda_handler_minimal.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY 