service: sheet-assist-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment: ${file(env-${self:provider.stage}.yml):${self:provider.stage}}
  timeout: 900  # Maximum timeout of 15 minutes
  memorySize: 1024
  apiGateway:
    binaryMediaTypes:
      - 'multipart/form-data'
  httpApi:
    cors:
      allowedOrigins:
        - https://localhost:3000
        - http://localhost:3000
        - https://aidocassist.com
        - https://sheetassistapp.com
        - https://www.aidocassist.com
        - https://api.aidocassist.com
        - http://api.aidocassist.com
      allowedHeaders:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
        - '*'  # Allow all headers
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - '*'  # Allow all methods
      allowCredentials: true
      maxAge: 86400  # Match the maxAge in FastAPI configuration
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - "arn:aws:s3:::${self:provider.environment.TEMP_BUCKET}/*"
            - "arn:aws:s3:::${self:provider.environment.TEMP_BUCKET}"
  
plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    usePoetry: false
    slim: true
    slimPatterns:
      - "**/*.so"
      - "**/*.dist-info/**"
      - "**/__pycache__/**"
      - "**/*.egg-info/**"
      - "**/tests/**"
      - "**/.github/**"
      - "**/.pytest_cache/**"
    strip: false   # Don't strip binary files
    fileName: requirements-lambda.txt
    pipCmdExtraArgs:
      - '--only-binary=:all:'
    noDeploy:
      - pytest
      - pytest-cov
      - coverage
  # Define unique names for resources
  resourceNames:
    logGroup: '/aws/lambda/${self:service}-${self:provider.stage}-api-custom'
    apiGatewayLogGroup: '/aws/apigateway/${self:service}-${self:provider.stage}-custom'
  # Layer ARNs - Replace with actual ARNs after creating layers
  layerArns:
    core: ${param:coreLayerArn, 'CORE_LAYER_ARN_PLACEHOLDER'}
    data: ${param:dataLayerArn, 'DATA_LAYER_ARN_PLACEHOLDER'}
    llm: ${param:llmLayerArn, 'LLM_LAYER_ARN_PLACEHOLDER'}
    google: ${param:googleLayerArn, 'GOOGLE_LAYER_ARN_PLACEHOLDER'}
    utils: ${param:utilsLayerArn, 'UTILS_LAYER_ARN_PLACEHOLDER'}

package:
  individually: true
  patterns:
    - '!.elasticbeanstalk/**'
    - '!.ebextensions/**'
    - '!.platform/**'
    - '!venv/**'
    - '!node_modules/**'
    - '!package.json'
    - '!package-lock.json'
    - '!.git/**'
    - '!.pytest_cache/**'
    - '!tests/**'
    - '!docs/**'
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    - '!**/*.pyo'
    - '!**/*.pyd'
    - '!**/.DS_Store'
    - '!**/.serverless/**'
    - '!**/.idea/**'
    - '!**/.vscode/**'
    - '!**/node_modules/**'
    - '!layer-*.txt'
    - '!create_layers.sh'
    - '!requirements.txt'
    - '!README*'
    - '!LICENSE*'
    - '!CHANGELOG*'

functions:
  api:
    handler: lambda_handler.handler  # Use the full application handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY
    timeout: 29  # Set timeout to match API Gateway limit
    layers:
      - ${self:custom.layerArns.core}
      - ${self:custom.layerArns.data}
      - ${self:custom.layerArns.llm}
      - ${self:custom.layerArns.google}
      - ${self:custom.layerArns.utils}

# Import CloudFormation resource templates
resources: ${file(resources.yml)} 